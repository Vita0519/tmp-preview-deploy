services:
  tmp-preview:
    # 镜像需预先构建（或从镜像仓库拉取）；fnOS 应用中心不会替你 docker build
    image: tmp-preview:2.0.0
    container_name: tmp-preview
    restart: unless-stopped
    ports:
      - "519:8000"
    environment:
      DATA_DIR: /data
      ADMIN_USERNAME: ${TP_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${TP_ADMIN_PASSWORD:-}
      SITE_TITLE: ${TP_SITE_TITLE:-临时预览站}
      PUBLIC_PORTAL: ${TP_PUBLIC_PORTAL:-0}
      COOKIE_SECURE: ${TP_COOKIE_SECURE:-0}
      TZ: Asia/Shanghai
    volumes:
      - "${TRIM_PKGVAR}/data:/data"
