<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12857a"/>
      <stop offset="1" stop-color="#0b3b36"/>
    </linearGradient>
  </defs>

  <!-- 底色：圆角方形，跟站点墨绿主题一致 -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- 预览窗口：浏览器外壳 + 三个点 + 内容区 -->
  <rect x="44" y="54" width="168" height="120" rx="14"
        fill="none" stroke="#ffffff" stroke-width="11"/>
  <line x1="44" y1="84" x2="212" y2="84" stroke="#ffffff" stroke-width="9"/>
  <circle cx="64" cy="69" r="5.5" fill="#ffffff"/>
  <circle cx="84" cy="69" r="5.5" fill="#ffffff"/>

  <!-- 内容区：一条标题线 + 两条正文线，示意"预览内容" -->
  <line x1="68" y1="112" x2="150" y2="112" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="68" y1="136" x2="122" y2="136" stroke="#9ff3e4" stroke-width="9" stroke-linecap="round" opacity="0.75"/>

  <!-- 到期：右下角倒计时环 + 指针，缺口表示时间在走 -->
  <circle cx="178" cy="178" r="36" fill="#0b3b36" stroke="#0b3b36" stroke-width="14"/>
  <circle cx="178" cy="178" r="36" fill="none" stroke="#5eead4" stroke-width="9"
          stroke-linecap="round" stroke-dasharray="150 76" transform="rotate(-90 178 178)"/>
  <line x1="178" y1="178" x2="178" y2="160" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="178" y1="178" x2="192" y2="186" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>
