<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    临时预览站 · 飞牛 fnOS 应用图标（备用矢量稿）

    正式图标以同目录的 icon-src.jpg 为准：飞牛只交付 64/256 两档 PNG，
    位图降采样比这里手绘的近似稿更贴近原设计，make_icons.py 会优先用它。
    这份 SVG 只在 icon-src.jpg 缺失时兜底，改动时要同步视觉，别当成唯一源。
  -->
  <!--
    画法：满版圆角 56/256（≈22%，贴近 squircle），系统再裁一次也不会露白角。
    背景那枚大圆是原图的核心元素（像浏览器标识的那层）：圆心偏右下、半径很大，
    左上被浅蓝底吃掉一部分，只露出右上与右下两段清晰的弧线。
  -->
  <defs>
    <linearGradient id="bg" x1="0.02" y1="0.02" x2="0.98" y2="1">
      <stop offset="0" stop-color="#b6e0ff"/>
      <stop offset="0.34" stop-color="#68b6fd"/>
      <stop offset="0.7" stop-color="#4a9bfa"/>
      <stop offset="1" stop-color="#8ba3f6"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.34" cy="0.18" r="0.92">
      <stop offset="0" stop-color="#4a97fd"/>
      <stop offset="0.5" stop-color="#2277f7"/>
      <stop offset="0.88" stop-color="#1a6ef2"/>
      <stop offset="1" stop-color="#2b81f9"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.86" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#9aa8f8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9aa8f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a9cdfb"/>
      <stop offset="1" stop-color="#6ba4f4"/>
    </linearGradient>
    <linearGradient id="dial" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5aa6fc"/>
      <stop offset="1" stop-color="#1568e6"/>
    </linearGradient>
    <filter id="winShadow" x="-25%" y="-25%" width="160%" height="175%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0d3f92" flood-opacity="0.2"/>
    </filter>
    <filter id="clockShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0d3f92" flood-opacity="0.24"/>
    </filter>
    <clipPath id="card"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <!-- 底色 + 背景大圆（原图里那层浏览器感的弧） -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="112" cy="133" r="124" fill="url(#disc)"/>
    <rect width="256" height="256" fill="url(#haze)"/>
  </g>

  <!-- 预览窗口：白卡 + 右侧厚度 + 三个窗口点 + 内容块 + 两条说明线（整体轻微上抬 2°，跟原图一致） -->
  <g transform="rotate(-2.2 124 95)">
    <g filter="url(#winShadow)">
      <rect x="41" y="30" width="177" height="141" rx="17" fill="#dde6f7"/>
      <rect x="36" y="25" width="177" height="141" rx="17" fill="#fdfdff"/>
    </g>
    <circle cx="66" cy="50" r="7.2" fill="#ef4a5e"/>
    <circle cx="92" cy="50" r="7.2" fill="#f5a623"/>
    <circle cx="118" cy="50" r="7.2" fill="#2ec27e"/>

    <rect x="48" y="62" width="124" height="47" rx="8" fill="url(#pane)"/>
    <rect x="48" y="121" width="80" height="7.5" rx="3.7" fill="#d7ddeb"/>
    <rect x="48" y="137" width="56" height="7.5" rx="3.7" fill="#e1e6f0"/>
  </g>

  <!-- 到期倒计时：右下角时钟，白圈 + 蓝表盘 + 12 点 / 5 点指针 -->
  <g filter="url(#clockShadow)">
    <circle cx="152" cy="136" r="48" fill="#ffffff"/>
  </g>
  <circle cx="152" cy="136" r="36.5" fill="url(#dial)"/>
  <g stroke="#ffffff" stroke-width="7.6" stroke-linecap="round" fill="none">
    <line x1="152" y1="136" x2="152" y2="114"/>
    <line x1="152" y1="136" x2="169" y2="146"/>
  </g>
</svg>
