<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    临时预览站 · 飞牛 fnOS 应用图标
    满版圆角方块（rx 56 ≈ 22%，贴近 iOS squircle），系统再裁一次也不会露白角。
    受众是桌面图标：64px 下只留「蓝底 + 白窗口 + 时钟」三层信息，
    最细线条 7px @256 → 1.75px @64，再细就糊成一片了。
  -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#7cc2f8"/>
      <stop offset="0.52" stop-color="#2b7cf0"/>
      <stop offset="1" stop-color="#1960da"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.24" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a9cdfb"/>
      <stop offset="1" stop-color="#6ba4f4"/>
    </linearGradient>
    <linearGradient id="dial" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5aa2fb"/>
      <stop offset="1" stop-color="#1c66e2"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0b3d8f" flood-opacity="0.26"/>
    </filter>
    <filter id="clockShadow" x="-40%" y="-40%" width="180%" height="195%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b3d8f" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 底色 -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#glow)"/>

  <!-- 预览窗口：白卡片 + 三个窗口点 + 内容块 + 两条说明线 -->
  <g filter="url(#soft)">
    <rect x="52" y="66" width="150" height="118" rx="15" fill="#fbfcff"/>
  </g>
  <circle cx="72" cy="85" r="6.2" fill="#ef4a5e"/>
  <circle cx="92" cy="85" r="6.2" fill="#f6a723"/>
  <circle cx="112" cy="85" r="6.2" fill="#2fc07a"/>

  <rect x="66" y="103" width="122" height="46" rx="8" fill="url(#pane)"/>
  <rect x="66" y="160" width="94" height="7" rx="3.5" fill="#d5dce8"/>
  <rect x="66" y="174" width="66" height="7" rx="3.5" fill="#e0e5ee"/>

  <!-- 到期倒计时：右下角时钟，表盘与主色同族，指针指向 12 点与 4 点 -->
  <g filter="url(#clockShadow)">
    <circle cx="185" cy="178" r="50" fill="#ffffff"/>
  </g>
  <circle cx="185" cy="178" r="40" fill="url(#dial)"/>
  <g stroke="#ffffff" stroke-width="8.5" stroke-linecap="round" fill="none">
    <line x1="185" y1="178" x2="185" y2="156"/>
    <line x1="185" y1="178" x2="203" y2="188"/>
  </g>
</svg>
