services:
  preview:
    # 默认直接拉预构建镜像；想本地构建就注释 image、取消 build 段
    image: ghcr.io/vita0519/tmp-preview:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: tmp-preview
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "${PORT:-8080}:8000"
    environment:
      SITE_TITLE: ${SITE_TITLE:-临时预览站}
      SITE_SUBTITLE: ${SITE_SUBTITLE:-到期自动回收 · 多 Agent 共享}
      AUTHOR_NAME: ${AUTHOR_NAME:-vita}
      AUTHOR_BIO: ${AUTHOR_BIO:-互联网混子}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEFAULT_TTL_HOURS: ${DEFAULT_TTL_HOURS:-24}
      DEFAULT_TTL_PORTAL_HOURS: ${DEFAULT_TTL_PORTAL_HOURS:-6}
      DEFAULT_TTL_LINK_HOURS: ${DEFAULT_TTL_LINK_HOURS:-12}
      DEFAULT_TTL_PRIVATE_HOURS: ${DEFAULT_TTL_PRIVATE_HOURS:-0}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      PUBLIC_PORTAL: ${PUBLIC_PORTAL:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：自动更新（每天 04:30 检查 :latest）。启用：docker compose --profile autoupdate up -d
  watchtower:
    image: containrrr/watchtower:latest
    container_name: tmp-preview-watchtower
    restart: unless-stopped
    profiles: ["autoupdate"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 30 4 * * *}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
